<!DOCTYPE html><html><head><meta charset="utf-8"><title>GIL_BASTIDAS_ARQ</title><meta name="viewport" content="width=device-width"><style>body{margin:0;font-family:sans-serif;background:#111;color:#eee}header{padding:12px;background:#1a1a1a;color:#4ade80;font-weight:bold}#c{width:100%;height:55vh;background:#000}#p{padding:12px}.m{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #333}</style><script type="importmap">{ "imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"} }</script></head><body><header>GIL_BASTIDAS_ARQ_SIMULADOR - 2026II - USM</header><div id="c"></div><div id="p"><label>Ancho x: <b id="vx">6.50</b> m</label><input id="ix" type="range" min="3" max="12" step="0.05" value="6.5" style="width:100%"><label>Perimetro P: <b id="vp">40.00</b> m</label><input id="ip" type="range" min="20" max="60" step="0.5" value="40" style="width:100%"><label>Altura h: <b id="vh">2.85</b> m - requisito</label><input id="ih" type="range" min="2.4" max="3.5" step="0.05" value="2.85" style="width:100%"><div class="m"><span>Area Cuadratica A(x)=-x²+(P/2)x</span><b id="ma"></b></div><div class="m"><span>Vertice xv=P/4</span><b id="mv"></b></div><div class="m"><span>Volumen V=A*h</span><b id="mvol"></b></div><div class="m"><span>Costo Lineal C=mA+b</span><b id="mc"></b></div><p style="font-size:11px;color:#4ade80">✓ Decimales 2.85m ✓ Ecuacion Lineal ✓ Ecuacion Cuadratica ✓ Three.js</p></div><script type="module">import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';let S,C,R,ctrl,B;const ct=document.getElementById('c');function init(){S=new THREE.Scene();C=new THREE.PerspectiveCamera(60,ct.clientWidth/ct.clientHeight,0.1,100);C.position.set(12,10,12);R=new THREE.WebGLRenderer({antialias:true});R.setSize(ct.clientWidth,ct.clientHeight);ct.appendChild(R.domElement);ctrl=new OrbitControls(C,R.domElement);S.add(new THREE.AmbientLight(0xffffff,0.7));let d=new THREE.DirectionalLight(0xffffff,0.8);d.position.set(10,20,10);S.add(d);S.add(new THREE.GridHelper(30,30));B=new THREE.Group();S.add(B);loop()}function loop(){requestAnimationFrame(loop);ctrl.update();R.render(S,C)}function calc(){let x=parseFloat(ix.value),P=parseFloat(ip.value),h=parseFloat(ih.value);let A=-x*x+(P/2)*x,v=P/4,vol=A*h,cost=A*1200000+5000000;vx.textContent=x.toFixed(2);vp.textContent=P.toFixed(2);vh.textContent=h.toFixed(2);ma.textContent=A.toFixed(2)+' m2';mv.textContent=v.toFixed(2)+' m';mvol.textContent=vol.toFixed(2)+' m3';mc.textContent='$'+cost.toLocaleString();B.clear();let g=new THREE.BoxGeometry(x,h,P/2-x);let m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x4ade80}));m.position.y=h/2;B.add(m)}ix.oninput=ip.oninput=ih.oninput=calc;init();calc();</script></body></html>
